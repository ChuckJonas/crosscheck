name: crosscheck release

# Builds the X4 Pro release firmware on a crosscheck-v* tag and publishes it
# as a GitHub release, named as the on-device updater requests it.
on:
  push:
    tags:
      - 'crosscheck-v*'

permissions:
  contents: write

jobs:
  release-x4pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build crosscheck for the X4 Pro
        run: pio run -e x4pro-gh_release -j1

      - name: Name the release asset
        run: cp .pio/build/x4pro-gh_release/firmware.bin firmware-x4pro.bin

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: firmware-x4pro.bin
          generate_release_notes: true
          body: |
            Install: download `firmware-x4pro.bin`, open https://crosspointreader.com/#flash-tools, select Xteink X4Pro, click "Custom .bin", and upload the file. A device that already runs crosscheck updates itself from Settings → Check for updates.
